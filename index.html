<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Delight Global Services</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <!-- Company Logo -->
        <a href="#home" class="navbar__brand" aria-label="Go to homepage">
          <img src="" alt="" class="navbar__logo" id="navbar-logo" />
        </a>

        <!-- Mobile Menu Toggle -->
        <button
          type="button"
          class="navbar__toggle"
          id="navbar-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="navbar-menu"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <!-- Navigation Menu -->
        <div class="navbar__menu" id="navbar-menu">
          <!-- Navigation Links -->
          <ul class="navbar__links" id="navbar-links">
            <!-- Navigation links will be rendered from siteConfig -->
          </ul>

          <!-- Call-to-Action -->
          <a href="" class="navbar__cta" id="navbar-cta">
            <!-- CTA text will be rendered from siteConfig -->
          </a>
        </div>
      </nav>
    </header>

    <!-- Main JavaScript -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
