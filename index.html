<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Delight Global Services</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <!-- Company Logo -->
        <a href="#home" class="navbar__brand" aria-label="Go to homepage">
          <img src="" alt="" class="navbar__logo" id="navbar-logo" />
        </a>

        <!-- Mobile Menu Toggle -->
        <button
          type="button"
          class="navbar__toggle"
          id="navbar-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="navbar-menu"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <!-- Navigation Menu -->
        <div class="navbar__menu" id="navbar-menu">
          <!-- Navigation Links -->
          <ul class="navbar__links" id="navbar-links">
            <!-- Navigation links will be rendered from siteConfig -->
          </ul>

          <!-- Call-to-Action -->
          <a href="" class="navbar__cta" id="navbar-cta">
            <!-- CTA text will be rendered from siteConfig -->
          </a>
        </div>
      </nav>
    </header>

    <!-- ========================= HERO SECTION ========================== -->

    <section class="hero" id="home">
      <div class="hero__container container">
        <!-- Hero Content -->
        <div class="hero__content">
          <p class="hero__eyebrow" id="hero-eyebrow"></p>

          <h1 class="hero__heading" id="hero-heading"></h1>

          <p class="hero__description" id="hero-description"></p>

          <!-- Hero Buttons -->
          <div class="hero__actions" id="hero-actions">
            <!-- Buttons will be rendered from siteConfig -->
          </div>
        </div>

        <!-- Hero Image -->
        <div class="hero__visual">
          <img src="" alt="" class="hero__image" id="hero-image" />
        </div>
      </div>
    </section>

    <!-- ========================= ABOUT US SECTION ========================== -->

    <section class="about" id="about">
      <div class="about__container container">
        <!-- About Image -->
        <div class="about__visual">
          <img
            src=""
            alt=""
            class="about__image"
            id="about-image"
            loading="lazy"
          />
        </div>

        <!-- About Content -->
        <div class="about__content">
          <p class="about__eyebrow" id="about-eyebrow"></p>

          <h2 class="about__heading" id="about-heading"></h2>

          <p class="about__description" id="about-description"></p>

          <p class="about__supporting-text" id="about-supporting-text"></p>

          <!-- Call-to-Action -->
          <div class="about__actions" id="about-actions">
            <!-- CTA will be rendered from siteConfig -->
          </div>
        </div>
      </div>
    </section>

    <!-- ========================= SERVICES SECTION ========================== -->

    <section class="services" id="services">
      <div class="services__container container">
        <!-- Section Header -->
        <div class="services__header">
          <p class="services__eyebrow" id="services-eyebrow"></p>

          <h2 class="services__heading" id="services-heading"></h2>

          <p class="services__description" id="services-description"></p>
        </div>

        <!-- Services Grid -->
        <div class="services__grid" id="services-grid">
          <!-- Service cards will be rendered from siteConfig -->
        </div>
      </div>
    </section>

    <!-- Main JavaScript -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
