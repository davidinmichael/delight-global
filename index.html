<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Delight Global Services</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <!-- Company Logo -->
        <a href="#home" class="navbar__brand" aria-label="Go to homepage">
          <img src="" alt="" class="navbar__logo" id="navbar-logo" />
        </a>

        <!-- Mobile Menu Toggle -->
        <button
          type="button"
          class="navbar__toggle"
          id="navbar-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="navbar-menu"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <!-- Navigation Menu -->
        <div class="navbar__menu" id="navbar-menu">
          <!-- Navigation Links -->
          <ul class="navbar__links" id="navbar-links">
            <!-- Navigation links will be rendered from siteConfig -->
          </ul>

          <!-- Call-to-Action -->
          <a href="" class="navbar__cta" id="navbar-cta">
            <!-- CTA text will be rendered from siteConfig -->
          </a>
        </div>
      </nav>
    </header>

    <!-- ========================= HERO SECTION ========================== -->

    <section class="hero" id="home">
      <div class="hero__container container">
        <!-- Hero Content -->
        <div class="hero__content">
          <p class="hero__eyebrow" id="hero-eyebrow"></p>

          <h1 class="hero__heading" id="hero-heading"></h1>

          <p class="hero__description" id="hero-description"></p>

          <!-- Hero Buttons -->
          <div class="hero__actions" id="hero-actions">
            <!-- Buttons will be rendered from siteConfig -->
          </div>
        </div>

        <!-- Hero Image -->
        <div class="hero__visual">
          <img src="" alt="" class="hero__image" id="hero-image" />
        </div>
      </div>
    </section>

    <!-- ========================= ABOUT US SECTION ========================== -->

    <section class="about" id="about">
      <div class="about__container container">
        <!-- About Image -->
        <div class="about__visual">
          <img
            src=""
            alt=""
            class="about__image"
            id="about-image"
            loading="lazy"
          />
        </div>

        <!-- About Content -->
        <div class="about__content">
          <p class="about__eyebrow" id="about-eyebrow"></p>

          <h2 class="about__heading" id="about-heading"></h2>

          <p class="about__description" id="about-description"></p>

          <p class="about__supporting-text" id="about-supporting-text"></p>

          <!-- Call-to-Action -->
          <div class="about__actions" id="about-actions">
            <!-- CTA will be rendered from siteConfig -->
          </div>
        </div>
      </div>
    </section>

    <!-- ========================= SERVICES SECTION ========================== -->

    <section class="services" id="services">
      <div class="services__container container">
        <!-- Section Header -->
        <div class="services__header">
          <p class="services__eyebrow" id="services-eyebrow"></p>

          <h2 class="services__heading" id="services-heading"></h2>

          <p class="services__description" id="services-description"></p>
        </div>

        <!-- Services Grid -->
        <div class="services__grid" id="services-grid">
          <!-- Service cards will be rendered from siteConfig -->
        </div>
      </div>
    </section>
    <!-- ========================= INDUSTRIES SECTION ========================== -->

    <section class="industries" id="industries">
      <div class="industries__container container">
        <!-- Section Header -->
        <div class="industries__header">
          <p class="industries__eyebrow" id="industries-eyebrow"></p>

          <h2 class="industries__heading" id="industries-heading"></h2>

          <p class="industries__description" id="industries-description"></p>
        </div>

        <!-- Industry Cards -->
        <div class="industries__grid" id="industries-grid">
          <!-- Industry cards will be rendered from siteConfig -->
        </div>

        <!-- Section CTA -->
        <div class="industries__actions" id="industries-actions">
          <!-- CTA will be rendered from siteConfig -->
        </div>
      </div>
    </section>
    <!-- ========================= PAST PROJECTS SECTION ========================== -->

    <section class="projects" id="projects">
      <div class="projects__container container">
        <!-- Section Header -->
        <div class="projects__header">
          <p class="projects__eyebrow" id="projects-eyebrow"></p>

          <h2 class="projects__heading" id="projects-heading"></h2>

          <p class="projects__description" id="projects-description"></p>
        </div>

        <!-- Project Cards -->
        <div class="projects__grid" id="projects-grid">
          <!-- Project cards will be rendered from siteConfig -->
        </div>

        <!-- Section CTA -->
        <div class="projects__actions" id="projects-actions">
          <!-- CTA will be rendered from siteConfig -->
        </div>
      </div>
    </section>
    <!-- ========================= WHY CHOOSE US SECTION ========================== -->

    <section class="why-choose-us" id="why-choose-us">
      <div class="why-choose-us__container container">
        <!-- Section Header -->
        <div class="why-choose-us__header">
          <p class="why-choose-us__eyebrow" id="why-choose-us-eyebrow"></p>

          <h2 class="why-choose-us__heading" id="why-choose-us-heading"></h2>

          <p
            class="why-choose-us__description"
            id="why-choose-us-description"
          ></p>
        </div>

        <!-- Benefits Grid -->
        <div class="why-choose-us__grid" id="why-choose-us-grid">
          <!-- Benefit cards will be rendered from siteConfig -->
        </div>

        <!-- Section CTA -->
        <div class="why-choose-us__actions" id="why-choose-us-actions">
          <!-- CTA will be rendered from siteConfig -->
        </div>
      </div>
    </section>
    <!-- ======================================== TESTIMONIALS SECTION ======================================== -->
    <section class="testimonials" id="testimonials">
      <div class="testimonials__container container">
        <!-- Section Header -->
        <div class="testimonials__header">
          <p class="testimonials__eyebrow" id="testimonials-eyebrow"></p>
          <h2 class="testimonials__heading" id="testimonials-heading"></h2>
          <p
            class="testimonials__description"
            id="testimonials-description"
          ></p>
        </div>
        <!-- Testimonial Cards -->
        <div class="testimonials__grid" id="testimonials-grid">
          <!-- Testimonial cards will be rendered from siteConfig -->
        </div>
        <!-- Section CTA -->
        <div class="testimonials__actions" id="testimonials-actions">
          <!-- CTA will be rendered from siteConfig -->
        </div>
      </div>
    </section>
    <!-- ======================================== CONTACT SECTION ======================================== -->
    <section class="contact" id="contact">
      <div class="contact__container container">
        <!-- Section Header -->
        <div class="contact__header">
          <p class="contact__eyebrow" id="contact-eyebrow"></p>
          <h2 class="contact__heading" id="contact-heading"></h2>
          <p class="contact__description" id="contact-description"></p>
        </div>
        <!-- Contact Layout -->
        <div class="contact__layout">
          <!-- Contact Information -->
          <div class="contact__information">
            <h3
              class="contact__information-heading"
              id="contact-information-heading"
            ></h3>
            <!-- Address -->
            <div class="contact__item">
              <div class="contact__item-icon" aria-hidden="true">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <div class="contact__item-content">
                <h4 class="contact__item-label" id="contact-address-label"></h4>
                <p class="contact__item-value" id="contact-address-value"></p>
              </div>
            </div>
            <!-- Phone -->
            <div class="contact__item">
              <div class="contact__item-icon" aria-hidden="true">
                <i class="fa-solid fa-phone"></i>
              </div>
              <div class="contact__item-content">
                <h4 class="contact__item-label" id="contact-phone-label"></h4>
                <a
                  class="contact__item-link"
                  id="contact-phone-value"
                  href="tel:+234XXXXXXXXXX"
                ></a>
              </div>
            </div>
            <!-- Email -->
            <div class="contact__item">
              <div class="contact__item-icon" aria-hidden="true">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <div class="contact__item-content">
                <h4 class="contact__item-label" id="contact-email-label"></h4>
                <a
                  class="contact__item-link"
                  id="contact-email-value"
                  href="mailto:info@delightglobalservices.com"
                ></a>
              </div>
            </div>
            <!-- Business Hours -->
            <div class="contact__item">
              <div class="contact__item-icon" aria-hidden="true">
                <i class="fa-solid fa-clock"></i>
              </div>
              <div class="contact__item-content">
                <h4 class="contact__item-label" id="contact-hours-label"></h4>
                <p class="contact__item-value" id="contact-hours-value"></p>
              </div>
            </div>
          </div>
          <!-- Contact Form -->
          <div class="contact__form-wrapper">
            <div class="contact__form-header">
              <h3 class="contact__form-heading" id="contact-form-heading"></h3>
              <p
                class="contact__form-description"
                id="contact-form-description"
              ></p>
            </div>
            <form class="contact__form" id="contact-form">
              <!-- Form Fields Rendered from siteConfig -->
              <div class="contact__form-fields" id="contact-form-fields">
                <!-- JavaScript will render the form fields here -->
              </div>
              <!-- Form Feedback -->
              <div
                class="contact__form-feedback"
                id="contact-form-feedback"
                role="status"
                aria-live="polite"
                hidden
              ></div>
              <!-- Submit Button -->
              <button type="submit" class="contact__submit" id="contact-submit">
                <span id="contact-submit-label">Submit Enquiry</span>
                <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Main JavaScript -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
